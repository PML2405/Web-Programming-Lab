<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Add Product</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>

    <h2>Products</h2>
    <ul>
    {% for p in products %}
        <li>{{ p.title }} - {{ p.price }} - {{ p.description }}</li>
    {% endfor %}
    </ul>
</body>
</html>
