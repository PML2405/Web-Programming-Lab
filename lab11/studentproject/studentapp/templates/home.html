<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>

<h2>Enter Student Details</h2>

<form method="POST">
    {% csrf_token %}

    Student ID:
    <input type="text" name="student_id" required><br><br>

    Name:
    <input type="text" name="name" required><br><br>

    Course:
    <input type="text" name="course" required><br><br>

    Date of Birth:
    <input type="date" name="dob" required><br><br>

    <button type="submit">Submit</button>
</form>

<hr>

<h2>All Students</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Course</th>
        <th>DOB</th>
    </tr>

    {% for s in students %}
    <tr>
        <td>{{ s.student_id }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.course }}</td>
        <td>{{ s.dob }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
