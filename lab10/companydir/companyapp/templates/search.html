<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
</head>
<body>
    <h2>Search Company</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Search</button>
    </form>

    <ul>
    {% for name, city in results %}
        <li>{{ name }} - {{ city }}</li>
    {% endfor %}
    </ul>

    <a href="/add/">Add Work</a>
</body>
</html>
