<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
</head>
<body>
    <h2>Enter your details:</h2>
    
    <form method="POST" action="{% url 'page2' %}">
        {% csrf_token %}
        <label>Name:</label>
        {{form.name}} <br> <br>

        <label>Total Marks:</label>
        {{form.totalmarks}} <br> <br>

        <button type="submit">Calculate</button>
    </form>

</body>
</html>
