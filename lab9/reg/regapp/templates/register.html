<html>
    <head>
        <title>UserForm</title>
    </head>
    <body>
        <h2>Enter your details</h2>

        <form method="POST" action="{% url 'success' %}">
            {% csrf_token %}
            <label>UserName:</label>
            {{form.username}} <br> <br>

            <label>Password:</label>
            {{form.password}} <br><br>

            <label>Email ID:</label>
            {{form.emailid}} <br><br>

            <label>Contact:</label>
            {{form.contact}} <br><br>

            <button type="submit">Submit</button>
        </form>
    </body>
</html>
