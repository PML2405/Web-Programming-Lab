<!DOCTYPE html>
<html>
<head>
    <title>Grocery Checklist</title>

    <style>
        table, th, td {
            border: 2px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
    </style>
</head>
<body>

<h2>Select Items:</h2>

<form method="POST">
    {% csrf_token %}

    {% for item, price in items.items %}
        <input type="checkbox" name="items" value="{{ item }}">
        {{ item }} <br>
    {% endfor %}

    <br>
    <button type="submit">Add Item</button>
</form>

<br>

{% if selected_items %}
<h3>Selected Items:</h3>

<table>
    <tr>
        <th>Item Name</th>
        <th>Item Price</th>
    </tr>

    {% for item, price in selected_items.items %}
    <tr>
        <td>{{ item }}</td>
        <td>{{ price }}</td>
    </tr>
    {% endfor %}

</table>
{% endif %}

</body>
</html>
